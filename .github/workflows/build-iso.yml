# Builds the Cairn installer ISO from the latest published image.
# Start it by hand: Actions → Build Cairn ISO → Run workflow.
# The ISO is attached to the run as the "cairn-iso" artifact for 14 days.
name: Build Cairn ISO

on:
  workflow_dispatch:

env:
  IMAGE_NAME: cairn

jobs:
  iso:
    name: Build installer ISO
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Work out image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Download the latest Cairn image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${TOKEN}" | sudo podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          sudo podman pull "${IMAGE}"

      - name: Write installer settings
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: sed "s|@IMAGE@|${IMAGE}|g" disk_config/iso.toml > iso.toml && cat iso.toml

      - name: Build ISO
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v ./iso.toml:/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            --use-librepo=True \
            "${IMAGE}"
          sudo chown -R "$(id -u):$(id -g)" output
          ls -lhR output

      - name: Attach ISO to this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cairn-iso
          path: output/bootiso/install.iso
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
