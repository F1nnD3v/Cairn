# Builds the Cairn installer ISO from the latest published image.
# Start it by hand: Actions → Build Cairn ISO → Run workflow.
# The ISO is attached to the run as the "cairn-iso" artifact for 14 days.
name: Build Cairn ISO

on:
  workflow_dispatch:

env:
  IMAGE_NAME: cairn

jobs:
  iso:
    name: Build installer ISO
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Prepare the build machine for the ISO builder
        # 1. Ubuntu's AppArmor profile "bwrap-userns-restrict" attaches to every /usr/bin/bwrap,
        #    including the one the ISO builder runs inside its container, and strips the
        #    sandbox's permissions (dmesg: profile="unpriv_bwrap" ... capname="setuid"), so
        #    installing packages fails with "mount ... permission denied". Unload it on this
        #    throwaway build machine only.
        # 2. Use the Podman storage settings the official bootc-image-builder action uses
        #    on GitHub's machines.
        run: |
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser --remove /etc/apparmor.d/bwrap-userns-restrict
            echo "Unloaded the bwrap-userns-restrict AppArmor profile"
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf

      - name: Work out image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Download the latest Cairn image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${TOKEN}" | sudo podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          sudo podman pull "${IMAGE}"

      - name: Show the ISO builder where Fedora's software sources are
        # bootc-image-builder looks for software sources in /etc/yum.repos.d, but Fedora 45
        # keeps them in /usr/share/dnf5/repos.d, so the builder finds none ("no enabled
        # repositories"). Copy them over in a throwaway layer used only for the ISO;
        # installed systems switch to the real published image on their first update.
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          printf 'FROM %s\nRUN cp -v /usr/share/dnf5/repos.d/fedora*.repo /etc/yum.repos.d/\n' "${IMAGE}" > Containerfile.iso
          sudo podman build --pull=never --tag "${IMAGE}" --file Containerfile.iso .

      - name: Write installer settings
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: sed "s|@IMAGE@|${IMAGE}|g" disk_config/iso.toml > iso.toml && cat iso.toml

      - name: Build ISO
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v ./iso.toml:/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            --use-librepo=True \
            "${IMAGE}"
          sudo chown -R "$(id -u):$(id -g)" output
          ls -lhR output

      - name: Give the installer Cairn's look
        # The installer automatically applies images/product.img from the disc when it starts.
        # It holds Cairn's stylesheet and sidebar artwork (brand/installer/), and replaces
        # Fedora's installer stylesheet with Cairn's.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso cpio
          root="$(mktemp -d)"
          install -Dm0644 brand/installer/anaconda-gtk.css "${root}/anaconda-gtk.css"
          install -Dm0644 brand/installer/anaconda-gtk.css "${root}/usr/share/anaconda/pixmaps/fedora.css"
          install -Dm0644 -t "${root}/usr/share/anaconda/pixmaps/cairn" brand/installer/pixmaps/*.png
          (cd "${root}" && find . | cpio --quiet -o -H newc -R 0:0 | gzip -9) > product.img
          xorriso -indev output/bootiso/install.iso -outdev output/bootiso/cairn.iso \
            -map product.img /images/product.img \
            -boot_image any replay
          mv output/bootiso/cairn.iso output/bootiso/install.iso
          echo "--- /images on the ISO:"
          xorriso -indev output/bootiso/install.iso -find /images -exec lsdl -- 2>/dev/null
          echo "--- installer boot entries (they must load the installer from this disc for product.img to apply):"
          xorriso -osirrox on -indev output/bootiso/install.iso -extract /EFI/BOOT/grub.cfg grub.cfg 2>/dev/null \
            && grep -E 'menuentry|linux' grub.cfg || echo "(no /EFI/BOOT/grub.cfg)"

      - name: Show security denials (only when something failed)
        if: failure()
        run: sudo dmesg | grep -i -E 'apparmor|denied' | tail -n 40 || true

      - name: Attach ISO to this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cairn-iso
          path: output/bootiso/install.iso
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
