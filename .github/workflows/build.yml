# Builds the Cairn image.
#
# - Pull requests: build only, as a test. Nothing is published.
# - Merges to main, every day at 04:23 UTC, and manual runs: build and publish
#   to ghcr.io/<owner>/cairn. Installed machines update from there.
name: Build Cairn

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

env:
  IMAGE_NAME: cairn
  # The Fedora release Cairn is built on. Cairn's version number is this number.
  FEDORA_VERSION: "45"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        # A desktop image needs more room than the runner has by default.
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Work out image name and tags
        id: meta
        run: |
          date="$(date -u +%Y%m%d)"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${FEDORA_VERSION}.${date}" >> "$GITHUB_OUTPUT"
          echo "tags=latest ${FEDORA_VERSION} ${FEDORA_VERSION}.${date}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          podman build \
            --pull=newer \
            --build-arg FEDORA_VERSION="${FEDORA_VERSION}" \
            --build-arg CAIRN_VERSION="${{ steps.meta.outputs.version }}" \
            --label org.opencontainers.image.title="Cairn" \
            --label org.opencontainers.image.description="A desktop Linux distribution built on Fedora Kinoite" \
            --label org.opencontainers.image.version="${{ steps.meta.outputs.version }}" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --tag "localhost/${IMAGE_NAME}:build" \
            --file Containerfile \
            .

      - name: Split into update-friendly layers
        # Repacks the image into many small layers, so a daily update only
        # downloads the parts that changed instead of everything Cairn added.
        run: |
          graphroot="$(podman info --format '{{ .Store.GraphRoot }}')"
          podman run --rm --pull=never --privileged \
            --mount=type=image,src="localhost/${IMAGE_NAME}:build",target=/rpm-ostree \
            --mount=type=bind,src="${graphroot}",target=/run/host-container-storage,rw \
            --mount=type=tmpfs,target=/run/rpm-ostree-storage \
            --entrypoint /usr/bin/rpm-ostree \
            "localhost/${IMAGE_NAME}:build" \
            compose build-chunked-oci \
            --max-layers 127 \
            --format-version=2 \
            --bootc \
            --rootfs /rpm-ostree \
            --output "containers-storage:[overlay@/run/host-container-storage+/run/rpm-ostree-storage]localhost/${IMAGE_NAME}:chunked"
          podman images

      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${TOKEN}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          push() {
            for attempt in 1 2 3; do
              podman push "localhost/${IMAGE_NAME}:chunked" "docker://${IMAGE}:$1" && return 0
              echo "Push of $1 failed (attempt ${attempt}), retrying..."
              sleep $((attempt * 20))
            done
            return 1
          }
          for tag in ${TAGS}; do push "${tag}"; done
          echo "Published \`${IMAGE}\` with tags: ${TAGS}" >> "$GITHUB_STEP_SUMMARY"
